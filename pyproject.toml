[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creator-usage-statement"
version = "0.1.0"
description = "Email a fileable monthly creator-commerce usage statement"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
send-creator-statement = "creator_statement.send_monthly_statement:main"

[tool.hatch.build.targets.wheel]
packages = ["src/creator_statement"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
